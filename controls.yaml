# ILLUSTRATIVE mapping of rules to control IDs. Not an audit, not a
# certification, and not reviewed by an auditor. Adjust to your own framework.
controls:
  - id: SOC2-CC6.1
    framework: SOC 2
    title: Logical access security over protected information assets
    rules: [s3_public_access_blocked, sg_no_open_admin_ports, iam_console_user_mfa]

  - id: SOC2-CC6.7
    framework: SOC 2
    title: Restrict transmission and storage of information
    rules: [storage_encrypted]

  - id: SOC2-CC7.2
    framework: SOC 2
    title: Monitor system components for anomalies
    rules: [cloudtrail_multi_region, s3_access_logging]

  - id: ISO27001-A.5.15
    framework: ISO/IEC 27001:2022
    title: Access control
    rules: [s3_public_access_blocked, sg_no_open_admin_ports]

  - id: ISO27001-A.8.5
    framework: ISO/IEC 27001:2022
    title: Secure authentication
    rules: [iam_console_user_mfa]

  - id: ISO27001-A.8.15
    framework: ISO/IEC 27001:2022
    title: Logging
    rules: [cloudtrail_multi_region, s3_access_logging]

  - id: ISO27001-A.8.24
    framework: ISO/IEC 27001:2022
    title: Use of cryptography
    rules: [storage_encrypted]
